<div class="container-fluid py-4">

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Product Management</h2>
            <p class="text-muted mb-0">
                Create, update and manage insurance products.
            </p>
        </div>
    </div>

    <!-- Product List -->
    <div class="card shadow-sm border-0">

        <div class="card-header bg-white">

            <div class="row align-items-center">

                <div class="col-md-6">

                    <h5 class="mb-0 fw-bold">
                        Products
                    </h5>

                </div>

                <div class="col-md-6">

                    <input
                        class="form-control"
                        placeholder="Search products...">

                </div>

            </div>

        </div>

        <div class="table-responsive">

            <table class="table table-hover align-middle mb-0">

                <thead class="table-light">

                    <tr>

                        <th>Name</th>

                        <th>Type</th>

                        <th>Description</th>

                        <th>Status</th>

                        <th width="170" class="text-center">
                            Actions
                        </th>

                    </tr>

                </thead>

                <tbody>

                    <tr *ngFor="let p of products()">

                        <td class="fw-semibold">
                            {{ p.productName }}
                        </td>

                        <td>

                            <span class="badge bg-secondary">

                                {{ p.productType }}

                            </span>

                        </td>

                        <td>

                            {{ p.description }}

                        </td>

                        <td>

                            <span
                                class="badge rounded-pill"
                                [class.bg-success]="p.isActive"
                                [class.bg-danger]="!p.isActive">

                                {{ p.isActive ? 'Active' : 'Inactive' }}

                            </span>

                        </td>

                        <td class="text-center">

                            <button
                                class="btn btn-outline-primary btn-sm me-2"
                                (click)="edit(p)">
                                Edit
                            </button>
                            <button
                                class="btn btn-outline-danger btn-sm"
                                (click)="delete(p.productId)">
                                Deactivate
                            </button>
                        </td>
                    </tr>
                    <tr *ngIf="products().length === 0">
                        <td colspan="5" class="text-center text-muted py-4">
                            No products available.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Form Card -->
    <div class="card shadow-sm border-4 mb-4">

        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">
                {{ isEditMode ? 'Edit Product' : 'Add New Product' }}
            </h5>
        </div>

        <div class="card-body">

            <form [formGroup]="form" (ngSubmit)="create()">

                <div class="row">

                    <div class="col-lg-6 mb-3">

                        <label class="form-label fw-semibold">
                            Product Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            placeholder="Enter product name"
                            formControlName="productName">

                    </div>

                    <div class="col-lg-6 mb-3">

                        <label class="form-label fw-semibold">
                            Product Type
                        </label>

                        <select
                            class="form-select"
                            formControlName="productType">

                            <option [ngValue]="0">Health</option>
                            <option [ngValue]="1">Motor</option>
                            <option [ngValue]="2">Life</option>
                            <option [ngValue]="3">Travel</option>

                        </select>

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Description
                    </label>

                    <textarea
                        rows="4"
                        class="form-control"
                        placeholder="Enter product description"
                        formControlName="description">
                    </textarea>

                </div>

                <div class="form-check form-switch mb-4">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        formControlName="isActive">

                    <label class="form-check-label fw-semibold">
                        Active Product
                    </label>

                </div>

                <div class="text-end">

                    <button
                        class="btn btn-success px-4 me-2"
                        type="submit">

                        <i class="bi bi-check-circle me-1"></i>

                        {{ isEditMode ? 'Update Product' : 'Add Product' }}

                    </button>

                    <button
                        type="button"
                        class="btn btn-outline-secondary px-4"
                        (click)="resetForm()">

                        Cancel

                    </button>

                </div>

            </form>

        </div>

    </div>

    
</div>
